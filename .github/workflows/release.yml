name: Build & Release

on:
  workflow_dispatch:        # Manual trigger from GitHub UI
  push:
    tags:
      - "v*"                # Auto-trigger on version tags (v0.1.0, v1.0.0, etc.)

permissions:
  contents: write           # Needed to create GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest        # Intel Mac
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest      # Windows x64
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      # Windows needs WebView2 (pre-installed on modern Windows,
      # but the Tauri bundler embeds the bootstrapper automatically)

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "BudgetHandler v__VERSION__"
          releaseBody: "Hotel Financial Management App – see assets below for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Upload artifacts so they're available even without a release
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: budgethandler-${{ matrix.platform }}-${{ matrix.rust_target || 'default' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
